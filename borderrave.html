<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BORDERRAVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --acid: #3dff6e;
    --blood: #ff2b3d;
    --ink: #050605;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: #f2f2f0;
    font-family: 'Space Mono', monospace;
    overflow-x: hidden;
  }

  .br-stage {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    background: var(--ink);
    overflow: hidden;
  }

  .br-stage svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .br-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 100%),
      linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0) 55%, rgba(5,6,5,0.85) 90%, rgba(5,6,5,1) 100%);
  }

  .br-topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 26px;
    z-index: 5;
  }
  .br-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: #f2f2f0;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0;
    animation: br-fade-in 0.8s ease forwards;
    animation-delay: 6.1s;
    border: 1px solid rgba(242,242,240,0.35);
    padding: 8px 14px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
    background: rgba(5,6,5,0.35);
  }
  .br-back:hover { border-color: var(--acid); color: var(--acid); }

  .br-content {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 6vh;
    z-index: 4;
    text-align: center;
    padding: 0 20px;
  }

  .br-eyebrow {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--blood);
    margin: 0 0 10px;
    opacity: 0;
    animation: br-fade-up 0.9s ease forwards;
    animation-delay: 6.35s;
  }

  .br-title {
    font-family: 'Bebas Neue', 'Space Mono', sans-serif;
    font-size: clamp(3.2rem, 14vw, 8rem);
    line-height: 0.92;
    letter-spacing: 0.03em;
    margin: 0;
    color: #f5fff7;
    text-shadow: 0 0 22px rgba(61,255,110,0.55), 0 0 60px rgba(61,255,110,0.25);
    opacity: 0;
    animation: br-glitch-in 1.1s ease forwards;
    animation-delay: 6.5s;
  }

  .br-sub {
    margin: 14px 0 26px;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #cfd3cf;
    opacity: 0;
    animation: br-fade-up 0.9s ease forwards;
    animation-delay: 6.9s;
  }
  .br-sub b { color: var(--acid); font-weight: 700; }

  .br-cta {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink);
    background: var(--acid);
    padding: 15px 34px;
    border-radius: 2px;
    box-shadow: 0 0 30px rgba(61,255,110,0.4);
    opacity: 0;
    animation: br-fade-up 0.9s ease forwards;
    animation-delay: 7.3s;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .br-cta:hover { transform: translateY(-2px); box-shadow: 0 4px 40px rgba(61,255,110,0.65); }

  .br-scroll-note {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(242,242,240,0.4);
    opacity: 0;
    animation: br-fade-in 1s ease forwards;
    animation-delay: 7.75s;
  }

  @keyframes br-fade-in { to { opacity: 1; } }
  @keyframes br-fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes br-glitch-in {
    0%   { opacity: 0; transform: translateY(10px); filter: blur(6px); }
    55%  { opacity: 1; transform: translateY(0); filter: blur(0); }
    60%  { opacity: 0.7; transform: translate(-3px,1px); }
    65%  { opacity: 1; transform: translate(2px,0); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .br-info {
    max-width: 760px;
    margin: 0 auto;
    padding: 90px 24px 120px;
    text-align: center;
  }
  .br-info h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    letter-spacing: 0.04em;
    color: var(--acid);
    margin: 0 0 16px;
  }
  .br-info p {
    font-size: 14px;
    line-height: 1.8;
    color: #cfd3cf;
    margin: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .br-back, .br-eyebrow, .br-title, .br-sub, .br-cta, .br-scroll-note {
      animation: none !important;
      opacity: 1 !important;
      filter: none !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

<section class="br-stage" id="brStage">
  <svg viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="liquidEdge" x="-40%" y="-40%" width="180%" height="180%">
        <feTurbulence id="liquidNoise" type="fractalNoise" baseFrequency="0.014 0.085" numOctaves="2" seed="7" result="noise">
          <animate attributeName="baseFrequency" values="0.014 0.085;0.021 0.11;0.011 0.07;0.014 0.085"
                    dur="6s" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="17" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <mask id="revealMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
        <g id="dripColumns"></g>
      </mask>
      <radialGradient id="figureMaskGrad" cx="50%" cy="55%" r="55%">
        <stop offset="0%" stop-color="#fff"/>
        <stop offset="62%" stop-color="#fff"/>
        <stop offset="100%" stop-color="#000"/>
      </radialGradient>
      <mask id="figureMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920">
        <ellipse cx="545" cy="1150" rx="330" ry="650" fill="url(#figureMaskGrad)"/>
      </mask>
    </defs>
    <g id="heroGroup" mask="url(#revealMask)">
      <image href="images/borderrave-hero.jpg" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>
      <g mask="url(#figureMask)">
        <g id="figureZoomInner">
          <image href="images/borderrave-hero.jpg" x="0" y="0" width="1080" height="1920" preserveAspectRatio="xMidYMid slice"/>
        </g>
      </g>
    </g>
    <g id="dripBeads"></g>
  </svg>
  <div class="br-vignette"></div>

  <div class="br-topbar">
    <a href="index.html" class="br-back">&larr; Union Steinbrunn Schardenberg</a>
  </div>

  <div class="br-content">
    <p class="br-eyebrow">&mdash; Black Box Arena presents</p>
    <h1 class="br-title">BORDERRAVE</h1>
    <p class="br-sub">Line-up &amp; Datum folgen &middot; <b>Save the date</b></p>
    <a href="#" class="br-cta">Infos folgen</a>
    <p class="br-scroll-note">&darr; scroll</p>
  </div>
</section>

<section class="br-info">
  <h2>Was ist der Borderrave?</h2>
  <p>Ein eigenes Event, eine eigene Nacht &mdash; abseits der Vereinsseite. Details zu Line-up, Tickets und Location
  folgen in Kürze. Bleibt dran.</p>
</section>

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const columnsLayer = document.getElementById('dripColumns');
  const beadsLayer = document.getElementById('dripBeads');
  const figureZoomInner = document.getElementById('figureZoomInner');

  const VB_W = 1080, VB_H = 1920;
  const BODY_H = VB_H * 0.82;
  const N = 74;
  const ZOOM_DURATION = 6200;
  const ZOOM_FROM = 1.0, ZOOM_TO = 1.24;
  const ZOOM_ORIGIN_X = 545, ZOOM_ORIGIN_Y = 620;

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  const SVGNS = 'http://www.w3.org/2000/svg';

  // A rect body that necks down into a rounded drip-tip at its current bottom —
  // at small h the whole column IS the tip, so it starts life as a bead, not a bar.
  function dripPath(x, w, h) {
    if (h <= 0) return '';
    const tipLen = Math.min(w * 0.9, h);
    const bodyBottom = h - tipLen;
    const cx = x + w / 2;
    return `M${x.toFixed(1)},0 L${(x + w).toFixed(1)},0 L${(x + w).toFixed(1)},${bodyBottom.toFixed(1)} ` +
      `C${(x + w).toFixed(1)},${(bodyBottom + tipLen * 0.62).toFixed(1)} ${(x + w * 0.78).toFixed(1)},${h.toFixed(1)} ${cx.toFixed(1)},${h.toFixed(1)} ` +
      `C${(x + w * 0.22).toFixed(1)},${h.toFixed(1)} ${x.toFixed(1)},${(bodyBottom + tipLen * 0.62).toFixed(1)} ${x.toFixed(1)},${bodyBottom.toFixed(1)} Z`;
  }

  if (reduceMotion) {
    const rect = document.createElementNS(SVGNS, 'rect');
    rect.setAttribute('x', '0'); rect.setAttribute('y', '0');
    rect.setAttribute('width', VB_W); rect.setAttribute('height', VB_H);
    rect.setAttribute('fill', 'white');
    columnsLayer.appendChild(rect);
    figureZoomInner.setAttribute('transform',
      `translate(${ZOOM_ORIGIN_X},${ZOOM_ORIGIN_Y}) scale(${ZOOM_TO}) translate(${-ZOOM_ORIGIN_X},${-ZOOM_ORIGIN_Y})`);
  } else {
    const baseW = VB_W / N;
    const columns = [];
    for (let i = 0; i < N; i++) {
      const width = baseW * (1.18 + Math.random() * 0.22);
      const x = i * baseW - (width - baseW) / 2 + (Math.random() * 8 - 4);
      const delay1 = Math.random() * 1250;
      const dur1 = 3250 + Math.random() * 2450;
      const extra = Math.pow(Math.random(), 2) * 340;
      const dur2 = 1150 + extra * 8 * (0.7 + Math.random() * 0.6);

      const path = document.createElementNS(SVGNS, 'path');
      path.setAttribute('fill', 'white');
      path.setAttribute('filter', 'url(#liquidEdge)');
      columnsLayer.appendChild(path);

      columns.push({
        el: path, colX: x, width, x: x + width / 2,
        delay1, dur1, extra, dur2,
        finishAt: delay1 + dur1 + dur2,
        settled: false,
        lastHeight: 0
      });
    }

    const start = performance.now();

    function spawnBead(col) {
      const tipY = BODY_H + col.extra;
      const r = Math.max(col.width * (0.22 + Math.random() * 0.14), 4);
      const fallDist = 55 + Math.random() * 100;
      const dur = (1.1 + Math.random() * 1.4).toFixed(2);
      const delay = (Math.random() * 1.6).toFixed(2);

      const g = document.createElementNS(SVGNS, 'g');

      const circle = document.createElementNS(SVGNS, 'circle');
      circle.setAttribute('cx', col.x.toFixed(1));
      circle.setAttribute('cy', tipY.toFixed(1));
      circle.setAttribute('r', r.toFixed(1));
      circle.setAttribute('fill', 'rgba(4,8,5,0.88)');
      circle.setAttribute('stroke', 'rgba(61,255,110,0.22)');
      circle.setAttribute('stroke-width', '0.6');
      circle.setAttribute('opacity', '0');

      const animCy = document.createElementNS(SVGNS, 'animate');
      animCy.setAttribute('attributeName', 'cy');
      animCy.setAttribute('values', `${tipY.toFixed(1)};${(tipY + fallDist).toFixed(1)}`);
      animCy.setAttribute('dur', dur + 's');
      animCy.setAttribute('begin', delay + 's');
      animCy.setAttribute('repeatCount', 'indefinite');
      animCy.setAttribute('calcMode', 'spline');
      animCy.setAttribute('keySplines', '0.3 0 0.7 1');
      animCy.setAttribute('keyTimes', '0;1');

      const animOp = document.createElementNS(SVGNS, 'animate');
      animOp.setAttribute('attributeName', 'opacity');
      animOp.setAttribute('values', '0;0.9;0.85;0');
      animOp.setAttribute('keyTimes', '0;0.18;0.7;1');
      animOp.setAttribute('dur', dur + 's');
      animOp.setAttribute('begin', delay + 's');
      animOp.setAttribute('repeatCount', 'indefinite');

      circle.appendChild(animCy);
      circle.appendChild(animOp);
      g.appendChild(circle);
      beadsLayer.appendChild(g);
    }

    function tick(now) {
      const t = now - start;
      let allSettled = true;

      for (const col of columns) {
        if (col.settled) continue;
        allSettled = false;

        const t1 = Math.min(Math.max((t - col.delay1) / col.dur1, 0), 1);
        let h;
        if (t1 < 1) {
          h = easeOutCubic(t1) * BODY_H;
        } else {
          const t2 = Math.min(Math.max((t - col.delay1 - col.dur1) / col.dur2, 0), 1);
          const wobble = 0.045 * Math.sin(t2 * Math.PI * 3.2) * (1 - t2);
          const eased = Math.max(easeOutCubic(t2) + wobble, 0);
          h = BODY_H + eased * col.extra;
        }

        h = Math.max(h, col.lastHeight);
        col.lastHeight = h;
        col.el.setAttribute('d', dripPath(col.colX, col.width, h));

        if (t >= col.finishAt) {
          col.settled = true;
          col.el.setAttribute('d', dripPath(col.colX, col.width, BODY_H + col.extra));
          spawnBead(col);
        }
      }

      const zt = Math.min(t / ZOOM_DURATION, 1);
      const s = ZOOM_FROM + (ZOOM_TO - ZOOM_FROM) * easeOutCubic(zt);
      figureZoomInner.setAttribute('transform',
        `translate(${ZOOM_ORIGIN_X},${ZOOM_ORIGIN_Y}) scale(${s.toFixed(4)}) translate(${-ZOOM_ORIGIN_X},${-ZOOM_ORIGIN_Y})`);

      if (!allSettled || zt < 1) {
        requestAnimationFrame(tick);
      }
    }
    requestAnimationFrame(tick);
  }
</script>

</body>
</html>
